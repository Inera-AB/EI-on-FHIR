id: inera.ei.engagementindex
canonical: https://fhir.inera.se/ig/engagementindex
name: IneraEngagementIndex
title: "FHIR-baserat engagemangsindex (FHIR-EI)"
description: "Profiler, API och händelsemodell för FHIR-EI, ett index över i vilka källsystem det finns information om en patient, vilka informationsmängder som finns där och när de senast uppdaterades."
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0

publisher:
  name: Inera AB
  url: https://www.inera.se

jurisdiction: urn:iso:std:iso:3166#SE "Sweden"

# Subscriptions R5 Backport is not a dependency: its R4 package is built on FHIR 4.0.0,
# and IG Publisher 3 loads no resources from it. See the page Öppna frågor.
dependencies:
  hl7.fhir.uv.bulkdata: 2.0.0

# Inline instances (the resources inside the transaction example) get no id, since a
# conditional PUT resolves the target from its identifier.
instanceOptions:
  setId: standalone-only

parameters:
  show-inherited-invariants: false
  usage-stats-opt-out: true
  i18n-default-lang: sv

