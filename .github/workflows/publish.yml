name: Build and publish IG

# Branch builds to this repo's GitHub Pages. Releases are published by
# release.yml. The workflow itself lives in Inera-AB/fhir-ig-workflows.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'support/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: Inera-AB/fhir-ig-workflows/.github/workflows/build.yml@v1
    # The IG is FHIR R5; the shared workflow defaults to the R4 terminology server.
    with:
      tx-server: https://tx.fhir.org/r5
    secrets: inherit
